<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store deals — SaleKhoj</title>
<link rel="icon" href="favicon.svg">
<script>
(function () {
  var KEY = 'salekhoj-theme';
  var choice = localStorage.getItem(KEY) || 'auto';
  function resolve(c) {
    if (c === 'light' || c === 'dark') return c;
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var mql = window.matchMedia('(prefers-color-scheme: light)');
    if (mq.matches) return 'dark';
    if (mql.matches) return 'light';
    var h = new Date().getHours();
    return (h >= 19 || h < 6) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', resolve(choice));
})();
</script>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body data-page="brand" data-nav="brands.html">
<main id="main" class="wrap section">
  <div class="section-head">
    <h2 id="brand-name">Store</h2>
    <p id="brand-sub"></p>
    <a class="more" href="brands.html">&larr; All stores</a>
  </div>
  <div class="grid" id="brand-results"></div>
</main>
</body>
</html>
